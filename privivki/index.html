<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Памятка скоро будет доступна — врач-педиатр Корчагина Ю.А.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F6E5E">
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(165deg,#E4F3EE 0%,#D3EDE4 62%,#F7E1D8 135%);color:#12332E}
.card{max-width:440px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 20px 40px -24px rgba(18,51,46,.45);text-align:center}
.by{font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0F6E5E}
h1{font-size:1.5rem;line-height:1.2;margin-top:10px}
p{color:#2E4A45;margin-top:10px}
a.btn{display:inline-block;margin-top:20px;background:#0F6E5E;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:99px}
a.btn:focus-visible{outline:3px solid #F2A48C;outline-offset:2px}
@media (prefers-color-scheme:dark){body{background:#0F1E1B;color:#E6F2EF}.card{background:#17302B}p{color:#B9D3CD}.by{color:#7FD3BF}}
</style>
</head>
<body>
<main class="card">
  <div class="by">Врач-педиатр Корчагина Ю.А.</div>
  <h1>Памятка скоро будет доступна</h1>
  <p>Сейчас эту памятку готовят к публикации. По вопросам прививок обращайтесь к своему врачу на приёме.</p>
  <a class="btn" href="../">Все памятки</a>
</main>
<!-- Service worker здесь не регистрируем: sw.js этой папки получают только те, у кого была сохранена
     старая памятка (браузер сам проверяет его обновление); он чистит её кэш и отключается. -->
</body>
</html>
